<div class="product-card" [class.sin-stock]="producto.stock === 0">
  <div class="product-img-wrapper">
    <img [src]="producto.imagen" [alt]="producto.nombre" class="product-img" loading="lazy" />
    <span class="product-category">{{ producto.categoria }}</span>
    <span class="stock-badge" [class.agotado]="producto.stock === 0">
      {{ producto.stock === 0 ? 'Agotado' : producto.stock + ' en stock' }}
    </span>
  </div>
  <div class="product-body">
    <h3 class="product-name">{{ producto.nombre }}</h3>
    <p class="product-desc">{{ producto.descripcion }}</p>
    <div class="product-price-row">
      <span class="product-price">${{ producto.precio | number }}</span>
    </div>
    <div class="admin-controls" *ngIf="showAdminControls || showEditButton || showDeleteButton">
      <div class="stock-admin" *ngIf="showAdminControls">
        <button class="btn-stock" (click)="onStockChange(-1)" [disabled]="producto.stock === 0">−</button>
        <span class="stock-count">{{ producto.stock }}</span>
        <button class="btn-stock" (click)="onStockChange(1)">+</button>
      </div>
      <div class="admin-btns">
        <button *ngIf="showEditButton" class="btn-edit" (click)="onEdit()">✏️ Editar</button>
        <button *ngIf="showDeleteButton" class="btn-danger" (click)="onDelete()">🗑️</button>
      </div>
    </div>
    <button class="btn-add-cart" (click)="onAddToCart()" [disabled]="producto.stock === 0">
      {{ producto.stock === 0 ? '❌ Sin stock' : '🛒 Agregar al carrito' }}
    </button>
  </div>
</div>
