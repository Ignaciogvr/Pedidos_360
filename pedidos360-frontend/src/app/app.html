<div class="app-container">
  <ng-container>
    <nav class="navbar">
      <!-- Brand -->
      <a class="brand" routerLink="/dashboard">
        <div class="brand-icon">⚡</div>
        <span class="brand-text">Pedidos<span class="brand-accent">360</span></span>
      </a>

      <!-- Nav links -->
      <div class="nav-links" *ngIf="isAuthenticated()">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a routerLink="/orders" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">📋</span>
          <span>Pedidos</span>
        </a>
        <a routerLink="/catalog" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">📦</span>
          <span>Catálogo</span>
        </a>
        <a *ngIf="user() && (user()!.roles.includes('Admin') || user()!.roles.includes('ADMIN'))"
           routerLink="/admin/users" routerLinkActive="active" class="nav-link admin-link">
          <span class="nav-icon">👥</span>
          <span>Usuarios</span>
        </a>
      </div>

      <!-- Auth / User section -->
      <div class="auth-section">
        <ng-container *ngIf="!isAuthenticated()">
          <button class="btn-login" (click)="login()">
            <svg width="18" height="18" viewBox="0 0 21 21" fill="none" style="display:inline;vertical-align:middle;margin-right:6px">
              <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
              <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
              <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
              <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
            </svg>
            Ingresar con Microsoft
          </button>
        </ng-container>

        <ng-container *ngIf="isAuthenticated() && user()">
          <div class="user-pill" routerLink="/profile" style="cursor:pointer">
          <div class="user-pill-avatar">{{ getInitials(user()!.name) }}</div>
            <div class="user-pill-info">
              <span class="user-pill-name">{{ user()!.name }}</span>
              <span class="user-pill-role" [ngClass]="getRoleClass(user()!.roles[0])">{{ user()!.roles[0] || 'Sin rol' }}</span>
            </div>
          </div>
          <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
            <span>🚪</span>
          </button>
        </ng-container>
      </div>
    </nav>

    <main class="main-content">
      <ng-container *ngIf="!isAuthenticated()">
        <div class="welcome-screen">
          <div class="welcome-badge">🔒 Plataforma corporativa segura</div>
          <h1>Bienvenido a <span class="brand-accent">Pedidos360</span></h1>
          <p>Gestiona tus pedidos de forma segura con autenticación corporativa de Microsoft Azure Entra ID.</p>
          <button class="btn btn-primary btn-large" (click)="login()">
            <svg width="20" height="20" viewBox="0 0 21 21" fill="none" style="display:inline;vertical-align:middle;margin-right:8px">
              <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
              <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
              <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
              <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
            </svg>
            Ingresar con Microsoft
          </button>
        </div>
      </ng-container>

      <ng-container *ngIf="isAuthenticated()">
        <router-outlet></router-outlet>
      </ng-container>
    </main>
  </ng-container>
</div>
